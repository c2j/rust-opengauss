[package]
name = "regress"
version = "0.0.0"
edition = "2024"
publish = false
description = "Regression guard tests for gaussdb-mcp type handling"

[features]
default = []
## Gates tests requiring a live DB at GAUSSDB_TEST_URL
## (or default host=127.0.0.1 port=5432 user=gaussdb).
## Off by default; enable with `--features integration` or `--all-features`.
integration = []

[dev-dependencies]
gaussdb = { path = "../../crates/gaussdb", features = [
    "tls-native-tls",
    "with-rust_decimal-1", "with-serde_json-1", "with-uuid-1", "with-chrono-0_4",
    "config", "sync",
] }
tokio = { version = "1", features = ["full"] }
